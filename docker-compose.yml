services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sproessling:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sproessling}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@postgres:5432/${POSTGRES_DB:-sproessling}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      BOOTSTRAP_INVITE_CODE: ${BOOTSTRAP_INVITE_CODE:-}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME:-Unsere Familie}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.org}
      CRON_SECRET: ${CRON_SECRET:-}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /backups
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - uploads:/data/uploads
      # Nur lesend: Die App zeigt die Sicherungen an, erstellt werden sie vom
      # Sidecar unten.
      - backups:/backups:ro
    ports:
      # Nur lokal binden – nach aussen geht es ueber den Cloudflare Tunnel.
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sproessling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-sproessling}
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sproessling} -d ${POSTGRES_DB:-sproessling}']
      interval: 10s
      timeout: 5s
      retries: 5

  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      APP_INTERNAL_URL: http://app:3000
      CRON_INTERVAL_SEC: ${CRON_INTERVAL_SEC:-300}
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - ./docker/cron.sh:/usr/local/bin/cron.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/cron.sh']

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-sproessling}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      PGDATABASE: ${POSTGRES_DB:-sproessling}
      PGHOST: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_REQUEST_FILE: /data/uploads/.backup-request
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - backups:/backups
      # Nur lesend: Hier legt die App die Anforderung "jetzt sichern" ab.
      - uploads:/data/uploads:ro
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']

  # Optional: Cloudflare Tunnel im selben Netz. Start mit
  # `docker compose --profile tunnel up -d`; ohne Profil bleibt der Container
  # aus, dann kann der Tunnel genauso gut am Host laufen.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ['tunnel']
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Vienna}
    # Token aus dem Cloudflare-Dashboard (Zero Trust -> Networks -> Tunnels).
    # Das Ingress-Ziel ist dann http://app:3000 – im Compose-Netz, nicht 127.0.0.1.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN fehlt}

volumes:
  pgdata:
  uploads:
  backups:
